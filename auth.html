
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | PixelVibe Visuals</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #18232e;
    }
    h1 { margin-top: 0; }
    p { color: #cbd5e1; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      color: white;
      background: #101820;
      border: 1px solid #475569;
    }
    button {
      border: 0;
      background: #54e0a0;
      color: #102018;
      font-weight: bold;
    }
    .secondary {
      background: transparent;
      color: #54e0a0;
      border: 1px solid #54e0a0;
    }
    #message { overflow-wrap: anywhere; }
    a { color: #54e0a0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome back</h1>
    <p>Create a customer account or sign in to PixelVibe Visuals.</p>

    <form id="auth-form">
      <input id="email" type="email"
        placeholder="Email address" autocomplete="email" required>

      <input id="password" type="password"
        placeholder="Password (at least 8 characters)"
        autocomplete="current-password" minlength="8" required>

      <button type="submit" id="login-btn">Log in</button>
      <button type="button" class="secondary" id="signup-btn">
        Create account
      </button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="index.html">Back to portfolio</a></p>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
